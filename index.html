<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>León a un toque</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Barra superior unificada (Botón menú + Buscador + Limpiar) -->
  <div class="search-bar-container">
    <div class="search-input-wrapper">
      <button id="toggle-sidebar-btn" class="icon-btn" title="Mostrar/Ocultar lista">
        <i class="fa-solid fa-bars"></i>
      </button>
      <input type="text" id="global-search" placeholder="Buscar trámite o lugar en León...">
      <button id="clear-search-btn" class="icon-btn hidden" title="Limpiar búsqueda">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Fondo oscuro para cerrar menús en móvil -->
  <div class="mobile-backdrop" id="mobile-backdrop"></div>

  <!-- Contenedor Principal -->
  <div class="main-container">
    <!-- Sidebar Izquierdo Colapsable -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <h3>Contenido del mapa</h3>
          <button id="close-sidebar-btn" class="icon-btn mobile-only" title="Cerrar panel">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
        </div>
        <p class="subtitle">Trámites y servicios de León, Guanajuato.</p>
      </div>

      <div class="filter-box">
        <input type="text" id="layer-search" placeholder="Filtrar servicios...">
      </div>

      <div class="poi-list" id="poi-list">
        <!-- Generado dinámicamente -->
      </div>
    </aside>

    <!-- Mapa a pantalla completa -->
    <div id="map"></div>
  </div>

  <!-- Panel de Información del Lugar (Lateral en PC / Inferior en Móvil) -->
  <div class="info-drawer" id="info-drawer">
    <div class="drawer-handle mobile-only"></div>
    <button class="close-btn" id="close-drawer" title="Cerrar">&times;</button>
    <div id="drawer-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
